name: E2E Automation CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome & Setup Webdriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          # Chrome is pre-installed on ubuntu-latest runner, but we ensure ChromeDriver setup is clean.

      - name: Wait for Test Site to be Reachable
        run: |
          echo "Checking if https://shop.qaautomationlabs.com/ is reachable..."
          for i in 1 2 3 4 5; do
            if curl -s --max-time 15 -o /dev/null -w "%{http_code}" https://shop.qaautomationlabs.com/ | grep -qE '^[23]'; then
              echo "Site is up! Proceeding with tests."
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 15 seconds..."
            sleep 15
          done
          echo "WARNING: Site may be slow. Proceeding anyway with extended timeouts."

      - name: Run Tests (Headless)
        env:
          HEADLESS: "true"
          CI_WAIT_TIMEOUT: "30"
        run: |
          pytest -v

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
